
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0B0"/>
      <stop offset="50%" stop-color="#D9AC55"/>
      <stop offset="100%" stop-color="#80521E"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#B99AFF"/>
      <stop offset="55%" stop-color="#7544DB"/>
      <stop offset="100%" stop-color="#32166D"/>
    </linearGradient>

    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8DEFF"/>
      <stop offset="100%" stop-color="#6846A5"/>
    </linearGradient>
  </defs>

  <!-- Outer silhouette -->
  <path d="M55 375 L100 175 L165 225 L205 105 L256 55 L307 105 L347 225 L412 175 L457 375 L256 455 Z"
        fill="url(#purple)" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Three temple peaks -->
  <path d="M105 210 L165 125 L225 210 Z"
        fill="url(#stone)" stroke="url(#gold)" stroke-width="6"/>
  <path d="M185 180 L256 65 L327 180 Z"
        fill="url(#stone)" stroke="url(#gold)" stroke-width="7"/>
  <path d="M287 210 L347 125 L407 210 Z"
        fill="url(#stone)" stroke="url(#gold)" stroke-width="6"/>

  <!-- Roof -->
  <path d="M80 215 H432 L405 265 H107 Z"
        fill="url(#gold)" stroke="#FFE8A0" stroke-width="5" stroke-linejoin="round"/>

  <!-- Three pillars -->
  <rect x="130" y="260" width="55" height="110" rx="4"
        fill="url(#stone)" stroke="url(#gold)" stroke-width="5"/>
  <rect x="228" y="260" width="55" height="110" rx="4"
        fill="url(#stone)" stroke="url(#gold)" stroke-width="5"/>
  <rect x="326" y="260" width="55" height="110" rx="4"
        fill="url(#stone)" stroke="url(#gold)" stroke-width="5"/>

  <!-- Pillar details -->
  <path d="M139 278 H176 M237 278 H274 M335 278 H372"
        stroke="#FFF0B0" stroke-width="5" stroke-linecap="round"/>
  <path d="M157 290 V355 M255 290 V355 M353 290 V355"
        stroke="#4A287F" stroke-width="5" opacity=".7"/>

  <!-- Pedestal -->
  <path d="M100 375 H412 L440 410 H72 Z"
        fill="url(#gold)" stroke="#FFE8A0" stroke-width="5"/>
  <path d="M72 410 H440 V438 H72 Z"
        fill="url(#purple)" stroke="url(#gold)" stroke-width="5"/>

  <!-- Central jewel -->
  <path d="M256 185 L286 215 L256 245 L226 215 Z"
        fill="#FFF0B0" stroke="#8B5BCF" stroke-width="5"/>
  <path d="M256 199 L272 215 L256 231 L240 215 Z"
        fill="url(#purple)"/>

  <!-- Decorative base details -->
  <path d="M110 392 H402"
        stroke="#FFF0B0" stroke-width="4" stroke-linecap="round"/>
</svg>
